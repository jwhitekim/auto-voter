name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ~/!Joonspace/everytime-like-bot
            git pull origin main
            docker stop like-bot 2>/dev/null || true
            docker rm like-bot 2>/dev/null || true
            docker build -t like-bot .
            docker run -d \
              --name like-bot \
              --restart unless-stopped \
              --env-file .env \
              like-bot
            docker ps | grep like-bot
