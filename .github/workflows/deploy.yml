name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ~/Joonspace/auto-voter
            git pull origin main
            docker stop auto-voter 2>/dev/null || true
            docker rm auto-voter 2>/dev/null || true
            docker build -t auto-voter .
            docker run -d \
              --name auto-voter \
              --restart unless-stopped \
              --env-file .env \
              auto-voter
            docker ps | grep auto-voter
