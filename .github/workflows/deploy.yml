name: Deploy Everytime Like Bot

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: everytime-like-bot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail

          : "${SSH_PRIVATE_KEY:?GitHub secret SSH_PRIVATE_KEY is not set}"
          : "${SSH_HOST:?GitHub secret SSH_HOST or SERVER_HOST is not set}"
          : "${SSH_PORT:?GitHub secret SSH_PORT is not set}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/everytime_like_bot_deploy
          chmod 600 ~/.ssh/everytime_like_bot_deploy

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER || secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          : "${SSH_USER:?GitHub secret SSH_USER or SERVER_USER is not set}"

          ssh \
            -i ~/.ssh/everytime_like_bot_deploy \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'wsl.exe -- bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /mnt/c/Users/admin/joonspace/everytime-like-bot
          git pull --ff-only origin main
          docker compose up -d --build
          docker compose ps
          REMOTE_SCRIPT
