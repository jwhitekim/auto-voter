name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python -m unittest discover test/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ~/Joonspace/auto-voter
            git pull origin main
            source ~/anaconda3/etc/profile.d/conda.sh
            conda activate voter
            pip install -r requirements.txt --quiet
            pkill -f "python -m app.bot" || true
            sleep 2
            nohup /home/prml/anaconda3/envs/voter/bin/python -m app.bot > ~/Joonspace/auto-voter/bot.log 2>&1 &
            sleep 3
            pgrep -f "python -m app.bot" && echo "Bot started successfully" || echo "Bot failed to start"
